name: CI Quality Gate

on:
  push:
    branches: [ main, master, resiliency-and-isolation ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Harden CI: Pin setuptools and pre-install wheel/numpy for Python 3.12 compatibility
        pip install setuptools==69.5.1 wheel numpy
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock flake8

    - name: Import Sanity Check
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        python -c "from telegram_transcriber import main, state_manager, processor, transcriber; print('✅ All modules importable')"

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pytest tests/test_hallucination_filter.py tests/test_isolation_and_softfail.py
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
